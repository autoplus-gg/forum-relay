name: Quality Checks

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache node modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-node-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare config
        run: bun run prepare:config

      - name: Run typecheck
        run: bun run typecheck

      - name: Run Biome
        run: bunx biome check .

      - name: Run Vitest with coverage
        run: bun run test:coverage

      - name: Check Drizzle schema
        run: bunx drizzle-kit check

      - name: Build
        run: bun run build
